<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="calculator.js" defer></script>
</head>
<body>
    
    <div class="container mt-3 main-container">
        <h2 class="bg-info text-center p-2">CALCULATOR</h2>
        <div class="row">
        
            <div class="col-12 col-md-12 mt-5 text-dark p-2 ">
                <!-- firstname textbox -->
                <label for="firstnumber">First Number &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
                <input type="text" name="fnum" id="firstnumber"><br><br>
            </div>
        </div>
        <div class="row">

                <div class="col-12 col-md-12 text-dark p-2 ">
                <!-- lastnum textbox -->
                <label for="secondnumber">Second Number</label>
                <input type="text" name="snum" id="secondnumber"><br><br>
            </div>
        </div>
        <div class="row">
            <!-- result textbox -->
             <div class="col-12 col-md-12 px-3 text-dark p-2 ">
                <label for="result">Result&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
                <input type="text" name="result" id="result"><br><br>
            </div>
        </div>
            
        <div class="row">
            <!-- adding buttons -->
            <div class="col-12 col-md-2 text-dark p-2 add">
                <input type="button" id="add" class="btn btn-primary" onclick="add()" value="Add">
                
            </div>
            <div class="col-12 col-md-2 text-dark p-2 sub">
                <input type="button" id="sub" class="btn btn-primary" onclick="sub()" value="Sub">
            </div>
            <div class="col-12 col-md-2 text-dark p-2 mul">
                <input type="button" id="mul"class="btn btn-primary"  onclick="mul()" value="Mul">
            </div>
            <div class="col-12 col-md-2 text-dark p-2 div">
                <input type="button" id="divide" class="btn btn-primary"  onclick="divide()" value="Div">
            </div>
             <div class="col-12 col-md-4 text-dark p-2 cancel">
                <input type="button" id="cancel" class="btn btn-danger" onclick="cancelfield()" value="cancel">
            </div>

        </div>
    </div>
</body>
</html>
